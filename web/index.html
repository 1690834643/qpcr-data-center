<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qPCR 数据中心</title>
<style>
:root{
  --bg:#F3EFE9; --panel:#FFFFFF; --panel2:#FAF7F3; --ink:#2A2521; --ink2:#5C544C; --muted:#9A9087;
  --line:#E7E0D7; --line2:#D9D0C4; --accent:#7A5230; --accent2:#A8794B; --accent-soft:#F3E9DE;
  --side:#29231E; --side2:#352D27; --side-ink:#E9DFD2; --side-muted:#A99B8B; --gold:#C9A27A;
  --ok:#4F8A62; --ok-soft:#E7F1EA; --warn:#B9862D; --warn-soft:#FBF1DE; --bad:#B0493F; --bad-soft:#F8E6E3;
  --serif:'Source Han Serif SC','Noto Serif SC','Source Han Serif CN','Songti SC','Microsoft YaHei UI','Microsoft YaHei',serif;
  --sans:'Segoe UI','Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 16px rgba(60,40,20,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:268px 1fr;height:100vh}

/* ---------- 侧栏 ---------- */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-height:0}
.brand{padding:22px 20px 16px;border-bottom:1px solid #3B322B;cursor:pointer}
.brand h1{font-size:19px;color:#F4EADD;display:flex;align-items:center;gap:10px}
.brand h1 .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(140deg,#C9A27A,#7A5230);display:grid;place-items:center}
.brand small{display:block;color:var(--side-muted);font-size:11.5px;margin-top:6px;letter-spacing:.06em}
.side-search{padding:14px 16px 6px}
.side-search input{width:100%;background:var(--side2);border:1px solid #43392F;border-radius:8px;padding:8px 11px;color:var(--side-ink);outline:none}
.side-search input::placeholder{color:#8A7C6E}
.side-search input:focus{border-color:var(--gold)}
.plist{flex:1;overflow:auto;padding:6px 10px 12px}
.plabel{font-size:11px;letter-spacing:.14em;color:#8A7C6E;padding:12px 10px 6px}
.pitem{border-radius:8px;margin:2px 0}
.phead{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--side-ink)}
.phead:hover{background:var(--side2)}
.phead .caret{width:12px;color:var(--side-muted);transition:transform .15s;font-size:10px}
.pitem.open .caret{transform:rotate(90deg)}
.phead .pname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .cnt{font-size:11px;color:var(--side-muted);background:#3A3029;border-radius:9px;padding:0 7px}
.pitem.active>.phead{background:#3D332B;color:#FFF6EA}
.elist{display:none;padding:2px 0 6px 21px}
.pitem.open .elist{display:block}
.eitem{display:flex;gap:8px;align-items:baseline;padding:5px 10px;border-radius:7px;cursor:pointer;color:#CFC3B5;font-size:13px}
.eitem:hover{background:var(--side2);color:#F4EADD}
.eitem.active{background:#4A3D32;color:#FFF6EA;box-shadow:inset 2px 0 0 var(--gold)}
.eitem .eid{font-size:10.5px;color:#8A7C6E;font-variant-numeric:tabular-nums}
.eitem .en{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{padding:12px 14px;border-top:1px solid #3B322B;display:flex;gap:8px}
.side-foot button{flex:1;background:var(--side2);border:1px solid #473C33;color:var(--side-ink);border-radius:8px;padding:8px;cursor:pointer}
.side-foot button:hover{border-color:var(--gold);color:#FFF}
.side-foot .primary{background:var(--gold);border-color:var(--gold);color:#2A2119;font-weight:600}
.side-foot .primary:hover{background:#D8B48D;color:#2A2119}

/* ---------- 主区 ---------- */
.main{overflow:auto;min-width:0}
.page{max-width:1320px;margin:0 auto;padding:26px 34px 60px}
.crumb{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.crumb a{color:var(--muted);cursor:pointer;text-decoration:none}
.crumb a:hover{color:var(--accent)}
.titlebar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.titlebar h2{font-size:25px;flex:1;min-width:240px}
.titlebar .sub{color:var(--ink2);font-size:13px;margin-top:4px;font-family:var(--sans);font-weight:400;letter-spacing:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:7px 13px;cursor:pointer;white-space:nowrap;transition:all .12s}
.btn:hover{border-color:var(--accent2);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#68441F;color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px;flex:1}
.card-b{padding:16px 18px}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.gray{background:#EFEBE6;color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:16px;padding:3px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.chip:hover{border-color:var(--accent2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* 首页 */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:20px}
.hero .card-b{padding:26px 28px}
.hero h2{font-size:28px;margin-bottom:10px}
.hero p{color:var(--ink2);margin:0 0 18px;max-width:560px}
.steps{display:grid;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-family:var(--serif)}
.step div{color:var(--ink2);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{padding:16px 18px}
.stat .v{font-family:var(--serif);font-size:28px;color:var(--accent);line-height:1.1}
.stat .k{color:var(--muted);font-size:12px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ecard{padding:16px 18px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:8px}
.ecard:hover{border-color:var(--accent2);transform:translateY(-1px)}
.ecard .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ecard h4{margin:0;font-size:15px;font-family:var(--serif);font-weight:600}
.ecard .genes{display:flex;gap:4px;flex-wrap:wrap}
.ecard .genes span{font-style:italic;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--ink2)}
.ecard .foot{display:flex;gap:12px;color:var(--muted);font-size:12px;margin-top:2px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink2);margin-bottom:6px}

/* 标签页 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin-bottom:18px}
.tab{padding:9px 16px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--accent)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .badge{font-size:10.5px;border-radius:8px;padding:0 6px;background:var(--bad-soft);color:var(--bad);font-weight:600}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;background:var(--panel2);padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid #F0EBE4;vertical-align:middle}
.tbl tr:hover td{background:#FCFAF7}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl input[type=text],.tbl input:not([type]),.tbl input[type=number]{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 7px}
.tbl input:hover{border-color:var(--line2)}
.tbl input:focus{border-color:var(--accent2);background:#fff;outline:none}
.scroll{max-height:560px;overflow:auto;border-radius:0 0 var(--r) var(--r)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:10px;white-space:nowrap}
.st.pass,.st.single{background:var(--ok-soft);color:var(--ok)}
.st.fixed{background:var(--warn-soft);color:var(--warn)}
.st.fail{background:var(--bad-soft);color:var(--bad)}
.cq{display:inline-block;font-variant-numeric:tabular-nums;font-size:12px;border:1px solid var(--line2);border-radius:5px;padding:0 6px;margin:1px 3px 1px 0;cursor:pointer;background:#fff}
.cq:hover{border-color:var(--accent2)}
.cq.out{text-decoration:line-through;color:var(--warn);background:var(--warn-soft);border-color:#EED9AE}
.cq.man{text-decoration:line-through;color:var(--bad);background:var(--bad-soft);border-color:#EBC5BF}
.sig{font-weight:700;color:var(--accent)}
.letters{font-family:var(--serif);font-weight:600;color:var(--accent)}

/* 告警 */
.notes{border-radius:var(--r);padding:12px 16px;margin-bottom:16px;background:var(--warn-soft);border:1px solid #EFDDB8;color:#7A5A1E;font-size:13px}
.notes ul{margin:4px 0 0;padding-left:18px}
.notes.ok{background:var(--ok-soft);border-color:#CFE3D5;color:#2F6040}

/* 结果 */
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.gene-h{font-style:italic;font-family:var(--serif)}
.mbar{height:8px;border-radius:4px;background:var(--accent2);opacity:.75}
.mbar-wrap{width:120px;background:#F2EEE8;border-radius:4px}

/* 作图 */
.plot-layout{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.ctrl{max-height:calc(100vh - 210px);overflow:auto}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.sec h4{margin:0 0 10px;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl{border:1px solid var(--line2);border-radius:8px;padding:8px 4px 6px;text-align:center;cursor:pointer;background:#fff;font-size:11.5px;color:var(--ink2);transition:all .12s}
.tpl svg{display:block;margin:0 auto 4px;width:44px;height:30px}
.tpl:hover{border-color:var(--accent2)}
.tpl.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preset{border:1px solid var(--line2);border-radius:8px;padding:6px 8px;cursor:pointer;background:#fff;font-size:12px;display:flex;flex-direction:column;gap:5px}
.preset:hover{border-color:var(--accent2)}
.preset.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.sw{display:flex;gap:2px}
.sw i{flex:1;height:9px;border-radius:2px}
.pal{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12px}
.pal:hover{background:var(--panel2)}
.pal.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pal .sw{width:150px}
.pal span{flex:1}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.row>label:first-child{width:62px;color:var(--ink2);flex:none;font-size:12.5px}
.row input[type=text],.row input[type=number],.row select{flex:1;min-width:0;border:1px solid var(--line2);border-radius:7px;padding:5px 8px;background:#fff}
.row input:focus,.row select:focus{outline:none;border-color:var(--accent2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:1}
.seg button{flex:1;border:none;background:#fff;padding:5px 6px;cursor:pointer;font-size:12px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}
.gcolors{display:grid;gap:4px}
.gc{display:flex;align-items:center;gap:7px;font-size:12.5px}
.gc input[type=checkbox]{accent-color:var(--accent)}
.gc input[type=color]{width:26px;height:22px;border:1px solid var(--line2);border-radius:5px;padding:0;background:none;cursor:pointer}
.gc span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc .mv{border:none;background:none;cursor:pointer;color:var(--muted);padding:0 3px}
.gc .mv:hover{color:var(--accent)}
.preview{position:sticky;top:12px}
.paper-wrap{background:repeating-conic-gradient(#EFEAE3 0% 25%,#F6F2EC 0% 50%) 50%/18px 18px;border-radius:var(--r);padding:28px;display:flex;justify-content:center;align-items:center;min-height:440px;border:1px solid var(--line)}
.paper{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08),0 12px 40px rgba(60,40,20,.10);line-height:0;max-width:100%}
.paper svg{display:block;width:100%;height:auto}
.pinfo{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 0;color:var(--muted);font-size:12px;gap:10px;flex-wrap:wrap}
.export{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.perr{color:var(--bad);padding:30px;line-height:1.6}

/* 导入 */
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:34px;text-align:center;cursor:pointer;background:var(--panel2);transition:all .15s}
.drop:hover,.drop.over{border-color:var(--accent2);background:var(--accent-soft)}
.drop h3{font-size:16px;margin:8px 0 4px}
.drop svg{color:var(--accent2)}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.f.w2{grid-column:span 2}
.f.w4{grid-column:span 4}
.f input,.f select,.f textarea{border:1px solid var(--line2);border-radius:7px;padding:7px 10px;background:#fff;color:var(--ink);font-size:13.5px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent-soft)}
.f .hint{color:var(--muted);font-size:11.5px}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.flist{display:grid;gap:8px}
.fi{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff;font-size:13px}
.fi .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi.err{border-color:#EBC5BF;background:var(--bad-soft)}
.ren{display:flex;align-items:center;gap:6px;font-size:12.5px}
.ren input{width:90px;border:1px solid var(--line2);border-radius:6px;padding:3px 7px}
.ren.warn input{border-color:var(--warn);background:var(--warn-soft)}
.batch{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel2);font-size:12.5px;flex-wrap:wrap}
.batch input{border:1px solid var(--line2);border-radius:6px;padding:4px 8px;width:120px}
.savebar{position:sticky;bottom:0;margin-top:18px;padding:12px 18px;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 -4px 20px rgba(60,40,20,.06)}
.savebar .info{flex:1;color:var(--ink2);font-size:13px}

/* 弹窗 + 提示 */
.mask{position:fixed;inset:0;background:rgba(30,22,16,.38);display:grid;place-items:center;z-index:50;animation:fade .15s}
.dlg{background:#fff;border-radius:14px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.dlg .card-b{display:grid;gap:12px}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;background:var(--panel2);border-top:1px solid var(--line)}
.toast{position:fixed;right:22px;bottom:22px;z-index:60;display:grid;gap:8px}
.toast div{background:#2A2521;color:#F4EADD;padding:10px 16px;border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.2);font-size:13px;max-width:420px;animation:up .2s}
.toast div.err{background:#8E3A32}
.watermark{position:fixed;right:18px;bottom:12px;z-index:40;pointer-events:none;user-select:none;font-family:var(--serif);font-size:13px;letter-spacing:.18em;color:var(--ink);opacity:.22}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (max-width:1100px){.plot-layout{grid-template-columns:1fr}.ctrl{max-height:none}.hero{grid-template-columns:1fr}.ed-grid{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand" onclick="go('home')">
      <h1><span class="logo"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6"><path d="M1 13c3 0 4-9 7-9s3 6 7 6" stroke-linecap="round"/></svg></span>qPCR 数据中心</h1>
      <small>CFX96 · ΔΔCt · 期刊出图</small>
    </div>
    <div class="side-search"><input id="q" placeholder="搜索项目 / 实验 / 基因" oninput="renderSide()"></div>
    <div class="plist" id="plist"></div>
    <div class="side-foot">
      <button class="primary" onclick="dlgNewProject()">＋ 新建项目</button>
      <button onclick="dlgSettings()" title="设置">设置</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="watermark">自动挡赛车手</div>

<script>
'use strict'
const S = {meta:null, projects:[], view:'home', proj:null, eid:null, exp:null, tab:'res',
           plot:null, svg:'', catFilter:'', ed:null, openProj:new Set()}
const $ = s => document.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const fmt = (v, d=3) => v === null || v === undefined || Number.isNaN(v) ? '·' : Number(v).toFixed(d).replace(/^-(0\.?0*)$/, '$1')
const fmtp = p => p === null || p === undefined ? '·' : (p < 0.0001 ? '<0.0001' : Number(p).toFixed(4))
const natcmp = (a, b) => String(a).localeCompare(String(b), 'zh', {numeric:true})

async function api(path, body) {
  const opt = body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}
  const r = await fetch(path, opt)
  const j = await r.json().catch(() => ({error:'服务器无响应'}))
  if (!r.ok) throw new Error(j.error || r.statusText)
  return j
}
function toast(msg, err) {
  const d = document.createElement('div')
  if (err) d.className = 'err'
  d.textContent = msg
  $('#toast').appendChild(d)
  setTimeout(() => d.remove(), err ? 6000 : 2800)
}
function guard(fn) {
  return async (...a) => { try { return await fn(...a) } catch (e) { toast(e.message, true); console.error(e) } }
}

// ------------------------------------------------------------ 侧栏
async function loadProjects() {
  S.projects = (await api('/api/projects')).projects
  renderSide()
}
function renderSide() {
  const kw = ($('#q').value || '').trim().toLowerCase()
  const hit = s => !kw || String(s).toLowerCase().includes(kw)
  let h = '<div class="plabel">项目</div>'
  if (!S.projects.length) h += '<div style="padding:8px 12px;color:#8A7C6E;font-size:12.5px">还没有项目，点下方「新建项目」开始。</div>'
  for (const p of S.projects) {
    const exps = p.experiments.filter(e => hit(p.name) || hit(e.name) || hit(e.category) || e.targets.some(hit))
    if (kw && !exps.length && !hit(p.name)) continue
    const open = S.openProj.has(p.name) || !!kw
    h += `<div class="pitem ${open?'open':''} ${S.proj===p.name&&S.view==='project'?'active':''}">
      <div class="phead" onclick="toggleProj('${esc(p.name)}')"><span class="caret">▶</span><span class="pname">${esc(p.name)}</span><span class="cnt">${p.n_exp}</span></div>
      <div class="elist">${exps.map(e => `<div class="eitem ${S.proj===p.name&&S.eid===e.id&&S.view!=='project'?'active':''}" onclick="openExp('${esc(p.name)}','${e.id}')"><span class="eid">${e.id}</span><span class="en" title="${esc(e.name)}">${esc(e.name)||'未命名'}</span></div>`).join('')}</div>
    </div>`
  }
  $('#plist').innerHTML = h
}
function toggleProj(name) {
  if (S.openProj.has(name) && S.proj === name && S.view === 'project') S.openProj.delete(name)
  else S.openProj.add(name)
  S.proj = name; S.catFilter = ''
  go('project')
}

// ------------------------------------------------------------ 路由
function go(view) {
  S.view = view
  renderSide()
  const m = $('#main')
  m.scrollTop = 0
  if (view === 'home') m.innerHTML = viewHome()
  else if (view === 'project') m.innerHTML = viewProject()
  else if (view === 'exp') { m.innerHTML = viewExp(); afterExp() }
  else if (view === 'edit') { m.innerHTML = viewEdit(); afterEdit() }
}
const openExp = guard(async (proj, id, tab) => {
  S.proj = proj; S.eid = id; S.openProj.add(proj)
  S.exp = await api(`/api/experiment?project=${encodeURIComponent(proj)}&id=${id}`)
  S.tab = tab || (S.view === 'exp' && S.eid === id ? S.tab : 'res')
  S.plot = null
  go('exp')
})
const curProject = () => S.projects.find(p => p.name === S.proj)

// ------------------------------------------------------------ 首页

  const recent = S.projects.flatMap(p => p.experiments.map(e => ({...e, proj:p.name}))).sort((a, b) => natcmp(b.updated, a.updated)).slice(0, 6)
  return `<div class="page">
    <div class="hero">
      <div class="card"><div class="card-b">
        <h2>荧光定量数据中心</h2>

        <div class="actions"><button class="btn primary" onclick="dlgNewProject()">＋ 新建项目</button>
        <button class="btn" onclick="api('/api/open_folder',{}).catch(e=>toast(e.message,true))">打开数据库文件夹</button></div>
      </div></div>
      <div class="card"><div class="card-b steps">
        <div class="step"><b>1</b><div><strong>建项目</strong>，按课题或实验内容分类，例如「敲低效率」「组织表达谱」。</div></div>
        <div class="step"><b>2</b><div><strong>导入 CFX 文件</strong>，支持原始 .pcrd 数据文件，以及 Quantification Summary / Cq Results 的 xlsx 与 csv，多块板自动合并。</div></div>
        <div class="step"><b>3</b><div><strong>确认内参、归一组与分组</strong>，结果实时预览，保存即写入项目 Excel。</div></div>
        <div class="step"><b>4</b><div><strong>选模板出图</strong>，一键套用风格预设，按单栏 / 双栏尺寸导出 SVG 或高清 PNG。</div></div>
      </div></div>
    </div>
    <div class="stats">
      <div class="card stat"><div class="v num">${S.projects.length}</div><div class="k">项目</div></div>
      <div class="card stat"><div class="v num">${nexp}</div><div class="k">实验</div></div>
      <div class="card stat"><div class="v num">${genes.size}</div><div class="k">检测基因</div></div>

    <p class="muted" style="margin-top:28px;font-size:12px">数据库位置：${esc(S.meta.root)} · v${S.meta.version} · ${esc(S.meta.author)}</p>

}
function expCard(e, proj) {
  return `<div class="card ecard" onclick="openExp('${esc(proj)}','${e.id}')">

// ------------------------------------------------------------ 项目页

// ------------------------------------------------------------ 实验页
function viewExp() {
  const {exp:e, analysis:a} = S.exp
  const nfail = a.qc.filter(r => r.status === 'fail').length

  return `<div class="page">
    <div class="crumb"><a onclick="go('home')">数据中心</a> / <a onclick="go('project')">${esc(S.proj)}</a> / ${e.id}</div>

    <div class="tabs">${tabs.map(([k, l]) => `<div class="tab ${S.tab===k?'on':''}" onclick="S.tab='${k}';go('exp')">${l}${k==='qc'&&nfail?`<span class="badge">${nfail}</span>`:''}</div>`).join('')}</div>

function afterExp() { if (S.tab === 'plot') { renderCtrl(); refreshPlot() } }

function warnBox(ws) {
  if (!ws || !ws.length) return '<div class="notes ok">数据完整，未发现需要注意的问题。</div>'
  return `<div class="notes"><strong>请注意</strong><ul>${ws.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`
}
function tabRes(a) {
  if (!a.targets.length) return warnBox(a.warnings) + '<div class="card empty"><h3>还没有结果</h3><p>请在「编辑设置与分组」里选择内参基因与归一组。</p></div>'
  let h = warnBox(a.warnings) + (a.methods_text ? `<div class="notes ok"><strong>统计方法</strong> ${esc(a.methods_text)}</div>` : '') + '<div class="res-grid">'
  for (const t of a.targets) {
    const g = a.genes[t], st = g.stats
    const mx = Math.max(...a.groups_order.map(k => g.groups[k]?.mean || 0), 1e-9)
    h += `<div class="card"><div class="card-h"><h3 class="gene-h">${esc(t)}</h3><span class="muted" style="font-size:12px">${esc(st.method_label || '未检验')}${st.p!==null&&st.method?' · 总体 p = ' + fmtp(st.p):''}</span></div>
      <table class="tbl"><thead><tr><th>分组</th><th class="r">n</th><th class="r">RQ 均值</th><th class="r">SEM</th><th></th><th class="r">log2FC</th><th class="r">p vs 对照</th><th>标注</th></tr></thead><tbody>
      ${a.groups_order.filter(k => g.groups[k]).map(k => { const d = g.groups[k]; const isC = k === a.ctrl
        return `<tr><td>${esc(k)}${isC?' <span class="tag gray">对照</span>':''}</td><td class="r">${d.n}</td><td class="r">${fmt(d.mean)}</td><td class="r">${fmt(d.sem)}</td>
        <td><div class="mbar-wrap"><div class="mbar" style="width:${Math.max(2, (d.mean||0)/mx*100)}%"></div></div></td>
        <td class="r">${fmt(d.log2fc, 2)}</td><td class="r">${isC ? '' : fmtp(st.p_vs_control[k])}</td>
        <td style="white-space:nowrap"><span class="sig">${isC ? '' : esc(st.stars_vs_control[k] || '')}</span> <span class="letters">${esc(st.letters[k] || '')}</span></td></tr>` }).join('')}
      </tbody></table></div>`
  }
  h += '</div>'
  h += `<div class="card" style="margin-top:16px"><div class="card-h"><h3>每个样本的 ΔΔCt</h3><span class="muted" style="font-size:12px">${a.per_sample.length} 行</span></div><div class="scroll"><table class="tbl"><thead><tr><th>样本</th><th>分组</th><th>基因</th><th class="r">内参 Cq</th><th class="r">目的 Cq</th><th class="r">ΔCt</th><th class="r">ΔΔCt</th><th class="r">RQ</th></tr></thead><tbody>
    ${a.per_sample.map(v => `<tr><td>${esc(v.sample)}</td><td>${esc(v.group)}</td><td><i>${esc(v.target)}</i></td><td class="r">${fmt(v.ref_cq,2)}</td><td class="r">${fmt(v.tgt_cq,2)}</td><td class="r">${fmt(v.dct)}</td><td class="r">${fmt(v.ddct)}</td><td class="r">${fmt(v.rq,4)}</td></tr>`).join('')}
  </tbody></table></div></div>`
  return h
}

function tabQC(a) {
  const s = a.qc_summary, p = a.params
  const lbl = {pass:'合格', single:'单孔', fixed:'剔除后合格', fail:'离散超阈'}
  const wellsOf = (r) => S.exp.wells.filter(w => w.sample === r.sample && w.target === r.target && w.cq !== null)
  return `<div class="notes ok" style="display:flex;gap:22px;flex-wrap:wrap"><span>合格 <b>${s.pass}</b> 组</span><span>其中自动剔除离群 <b>${s.fixed}</b></span><span style="color:${s.fail?'var(--bad)':'inherit'}">离散超阈 <b>${s.fail}</b></span>
    <span class="muted">阈值 ${p.metric==='range'?'极差':'SD'} ≤ ${p.thr}，${p.drop?'开启':'关闭'}三选二剔除。点击 Cq 可手动剔除或恢复该孔，自动保存并重算。</span></div>
  <div class="card"><div class="scroll" style="max-height:none"><table class="tbl"><thead><tr><th>样本</th><th>分组</th><th>基因</th><th class="r">孔数</th><th class="r">Cq 均值</th><th class="r">SD</th><th class="r">极差</th><th>各孔 Cq</th><th>判定</th></tr></thead><tbody>
  ${a.qc.map(r => `<tr><td>${esc(r.sample)}</td><td>${esc(r.group)}</td><td><i>${esc(r.target)}</i></td><td class="r">${r.n_raw}</td><td class="r">${fmt(r.mean,2)}</td><td class="r">${fmt(r.sd)}</td><td class="r">${fmt(r.range)}</td>
    <td>${wellsOf(r).map(w => { const idx = S.exp.wells.indexOf(w); const out = !w.excluded && r.outliers.includes(w.cq)
      return `<span class="cq ${w.excluded?'man':out?'out':''}" title="${esc(w.well)} ${esc(w.file)}${w.excluded?' · 已手动剔除':out?' · 自动剔除':''}" onclick="toggleWell(${idx})">${w.cq.toFixed(2)}</span>` }).join('')}</td>
    <td><span class="st ${r.status}">${lbl[r.status]}</span></td></tr>`).join('')}
  </tbody></table></div></div>`
}
const toggleWell = guard(async idx => {
  const w = S.exp.wells[idx]
  w.excluded = !w.excluded
  await saveCurrent(`孔 ${w.well} 已${w.excluded ? '剔除' : '恢复'}，已重算`)
})
async function saveCurrent(msg) {
  const {exp, wells, samples, gsets} = S.exp
  await api('/api/experiment/save', {project:S.proj, exp, wells, samples, gsets})
  await loadProjects()
  await openExp(S.proj, S.eid, S.tab)
  if (msg) toast(msg)
}

function tabRaw() {
  const {wells, exp} = S.exp
  return `<div class="card"><div class="card-h"><h3>原始孔数据</h3><span class="muted" style="font-size:12px">${wells.length} 孔 · 来源 ${esc((exp.files||[]).join('，') || '未记录')}</span>
    <button class="btn sm" onclick="guard(()=>api('/api/open_folder',{project:S.proj,sub:'原始文件'}))()">打开原始文件夹</button></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>孔位</th><th>样本</th><th>分组</th><th>基因</th><th>类型</th><th class="r">Cq</th><th>来源文件</th><th>剔除</th></tr></thead><tbody>
    ${wells.map(w => `<tr><td>${esc(w.well)}</td><td>${esc(w.sample)}</td><td>${esc(S.exp.samples[w.sample]||'')}</td><td><i>${esc(w.target)}</i></td><td>${esc(w.content)}</td><td class="r">${w.cq===null?'<span class="muted">无</span>':w.cq.toFixed(3)}</td><td class="muted" style="font-size:12px">${esc(w.file)}</td><td>${w.excluded?'<span class="st fail">是</span>':''}</td></tr>`).join('')}

function plotDefaults() {
  const d = JSON.parse(JSON.stringify(S.meta.defaults))
  const a = S.exp.analysis
  d.gene = a.targets[0] || ''
  return Object.assign(d, S.exp.exp.plot || {})
}
function tabPlot() {
  if (!S.exp.analysis.targets.length) return warnBox(S.exp.analysis.warnings) + '<div class="card empty"><h3>还没有可作图的结果</h3><p>请先在「编辑设置与分组」中选择内参与归一组。</p></div>'
  if (!S.plot) S.plot = plotDefaults()
  return `<div class="plot-layout"><div class="card ctrl" id="ctrl"></div>
    <div class="preview"><div class="paper-wrap"><div class="paper" id="paper"><div class="perr muted">正在绘制…</div></div></div>
      <div class="pinfo"><span id="pinfo"></span><span>预览随参数实时更新</span></div>
      <div class="export">
        <button class="btn" onclick="exportSVG()">下载 SVG（矢量）</button>
        <button class="btn" onclick="exportPNG(300)">PNG 300 dpi</button>
        <button class="btn" onclick="exportPNG(600)">PNG 600 dpi</button>
        <button class="btn primary" onclick="saveToProject()">保存到项目「图」文件夹</button>
        <button class="btn ghost" onclick="rememberPlot()">记住为本实验默认</button>
      </div></div></div>`
}
function seg(key, opts) {
  return `<div class="seg">${opts.map(([v, l]) => `<button class="${S.plot[key]===v?'on':''}" onclick="setP('${key}',${JSON.stringify(v).replace(/"/g,'&quot;')})">${l}</button>`).join('')}</div>`
}
function swatch(cols) { return `<div class="sw">${cols.slice(0, 8).map(c => `<i style="background:${c}"></i>`).join('')}</div>` }
function renderCtrl() {
  const P = S.plot, a = S.exp.analysis, M = S.meta
  const single = ['bar','box','dot','line'].includes(P.template)
  const multi = ['grouped','heatmap'].includes(P.template)
  const groupsAll = orderedGroups()
  const palCols = (M.palettes.find(p => p.key === P.palette) || M.palettes[0]).colors
  let k = 0
  const autoColor = g => { if (P.ctrl_gray && g === a.ctrl) return '#A6A6A6'; return palCols[(k++) % palCols.length] }
  const colorRows = groupsAll.map(g => { const ac = autoColor(g); return {g, c:P.colors[g] || ac, custom:!!P.colors[g]} })
  const on = g => !P.groups.length || P.groups.includes(g)
  let h = `<div class="sec"><h4>模板</h4><div class="tpls">${M.templates.map(t => `<div class="tpl ${P.template===t.key?'on':''}" onclick="setP('template','${t.key}')"><svg viewBox="0 0 44 30" fill="currentColor" stroke="currentColor" stroke-width="1">${TPL_ICON[t.key]}</svg>${t.label}</div>`).join('')}</div></div>`
  h += `<div class="sec"><h4>风格预设</h4><div class="presets">${M.presets.map(p => `<div class="preset ${P.preset===p.key?'on':''}" onclick="applyPreset('${p.key}')">${swatch(M.palettes.find(x=>x.key===p.palette).colors)}<span>${p.label}</span></div>`).join('')}</div></div>`
  h += `<div class="sec"><h4>数据</h4>`
  if (single) h += `<div class="row"><label>基因</label><select onchange="setP('gene',this.value)">${a.targets.map(t => `<option ${P.gene===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`
  if (multi) h += `<div class="row" style="align-items:flex-start"><label>基因</label><div class="chips">${a.targets.map(t => `<span class="chip ${!P.genes.length||P.genes.includes(t)?'on':''}" onclick="toggleList('genes','${esc(t)}')"><i>${esc(t)}</i></span>`).join('')}</div></div>`
  if (P.template !== 'heatmap') h += `<div class="row"><label>Y 轴</label>${seg('y', [['rq','相对表达 RQ'],['log2','log2FC']])}</div>`
  if (P.template !== 'heatmap' && P.template !== 'box') h += `<div class="row"><label>误差</label>${seg('err', [['sem','SEM'],['sd','SD']])}</div>`
  h += `<div class="row"><label>显著性</label>${seg('annot', [['auto','自动'],['letter','字母'],['star','星号'],['none','无']])}</div>`

function orderedGroups() {
  const a = S.exp.analysis
  const base = a.groups_order.slice()
  const ord = S.plot.order || []
  return base.sort((x, y) => { const i = ord.indexOf(x), j = ord.indexOf(y); return (i < 0 ? 999 + base.indexOf(x) : i) - (j < 0 ? 999 + base.indexOf(y) : j) })
}
function setP(k, v) { S.plot[k] = v; if (k !== 'preset' && ['palette','fill','point','err','ctrl_gray','heat'].includes(k)) S.plot.preset = ''; renderCtrl(); refreshPlot() }
function setPalette(k) { S.plot.colors = {}; setP('palette', k) }
function setColor(g, c) { if (c) S.plot.colors[g] = c; else delete S.plot.colors[g]; renderCtrl(); refreshPlot() }
function setSize(w) { S.plot.width_mm = w; S.plot.height_mm = Math.round(w * (S.plot.template === 'heatmap' ? 0.55 : 0.78)); renderCtrl(); refreshPlot() }
function applyPreset(key) {
  const p = S.meta.presets.find(x => x.key === key)
  Object.assign(S.plot, {preset:key, palette:p.palette, fill:p.fill, point:p.point, err:p.err, ctrl_gray:p.ctrl_gray, heat:p.heat, colors:{}})
  renderCtrl(); refreshPlot()
}
function toggleList(key, v) {
  const all = key === 'genes' ? S.exp.analysis.targets : orderedGroups()
  let cur = S.plot[key].length ? S.plot[key].slice() : all.slice()
  cur = cur.includes(v) ? cur.filter(x => x !== v) : all.filter(x => cur.includes(x) || x === v)
  if (!cur.length) return toast('至少保留一项')
  S.plot[key] = cur.length === all.length ? [] : cur
  renderCtrl(); refreshPlot()
}
function moveGroup(i, d) {
  const o = orderedGroups(), j = i + d
  if (j < 0 || j >= o.length) return
  ;[o[i], o[j]] = [o[j], o[i]]
  S.plot.order = o
  if (S.plot.groups.length) S.plot.groups = o.filter(g => S.plot.groups.includes(g))
  renderCtrl(); refreshPlot()
}
let plotTimer = null, plotSeq = 0
function refreshPlot() {
  clearTimeout(plotTimer)
  plotTimer = setTimeout(async () => {
    const seq = ++plotSeq
    const opts = {...S.plot, groups: S.plot.groups.length ? S.plot.groups : orderedGroups()}
    try {
      const r = await api('/api/plot', {project:S.proj, id:S.eid, opts})
      if (seq !== plotSeq) return
      S.svg = r.svg
      $('#paper').innerHTML = r.svg
      const w = S.plot.width_mm, h = S.plot.height_mm
      $('#paper').style.width = Math.min(860, w * 6.8) + 'px'
      $('#pinfo').textContent = `${w} × ${h} mm · ${S.plot.font_pt} pt`
    } catch (e) { if (seq === plotSeq) { S.svg = ''; $('#paper').innerHTML = `<div class="perr">${esc(e.message)}</div>` } }
  }, 120)
}
function figName(ext) {
  const P = S.plot, a = S.exp.analysis
  const what = ['grouped','heatmap'].includes(P.template) ? 'multi' : (P.gene || a.targets[0])
  return `${S.eid}_${what}_${P.template}.${ext}`.replace(/[\\/:*?"<>|]/g, '_')
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000)
}
function exportSVG() { if (!S.svg) return toast('图还没画好', true); download(new Blob([S.svg], {type:'image/svg+xml'}), figName('svg')) }
function svgToPng(dpi) {
  return new Promise((ok, bad) => {
    const img = new Image()
    const W = Math.round(S.plot.width_mm / 25.4 * dpi), H = Math.round(S.plot.height_mm / 25.4 * dpi)
    const svg = S.svg.replace(/width="[^"]+mm" height="[^"]+mm"/, `width="${W}" height="${H}"`)
    img.onload = () => { const c = document.createElement('canvas'); c.width = W; c.height = H
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0, W, H)
      c.toBlob(b => b ? ok(b) : bad(new Error('PNG 生成失败')), 'image/png') }
    img.onerror = () => bad(new Error('PNG 生成失败'))
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg)
  })
}
const exportPNG = guard(async dpi => { if (!S.svg) return toast('图还没画好', true); download(await svgToPng(dpi), figName('png').replace('.png', `_${dpi}dpi.png`)) })
const blobB64 = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.readAsDataURL(b) })
const saveToProject = guard(async () => {
  if (!S.svg) return toast('图还没画好', true)
  await api('/api/figure/save', {project:S.proj, filename:figName('svg'), svg:S.svg})
  const r = await api('/api/figure/save', {project:S.proj, filename:figName('png').replace('.png', '_600dpi.png'), png:await blobB64(await svgToPng(600))})
  await rememberPlot(true)
  toast('已保存 SVG 与 600 dpi PNG 到：' + r.path.replace(/[^\\/]+$/, ''))
})
const rememberPlot = guard(async quiet => {
  await api('/api/plot', {project:S.proj, id:S.eid, opts:S.plot, remember:true})
  S.exp.exp.plot = JSON.parse(JSON.stringify(S.plot))
  if (quiet !== true) toast('已记住作图设置，下次打开本实验自动套用')
})

const addFiles = guard(async fl => {
  const files = []
  for (const f of fl) files.push({name:f.name, data:await blobB64(f)})
  if (!files.length) return
  toast('正在解析 ' + files.length + ' 个文件…')
  const r = await api('/api/parse', {files})
  const E = S.ed
  const okNames = new Set(r.files.filter(f => f.n).map(f => f.name))
  E.files.push(...files.filter(f => okNames.has(f.name)))
  E.parsed.push(...r.files)
  E.wells.push(...r.wells)
  for (const [s, g] of Object.entries(r.suggest.samples)) if (!(s in E.samples)) E.samples[s] = g
  if (!E.exp.ref) E.exp.ref = r.suggest.ref
  if (!E.exp.ctrl) E.exp.ctrl = r.suggest.ctrl
  if (!E.exp.name && files.length) E.exp.name = guessName(files.map(f => f.name))
  const bad = r.files.filter(f => !f.n)
  if (bad.length) toast(`${bad.length} 个文件未能读取：${bad.map(b => b.name + '（' + b.error + '）').join('，')}`, true)
  renderFiles(); renderEdRest()
})

  S.ed.sel.forEach(s => S.ed.samples[s] = g); S.ed.sel.clear(); renderEdRest()
}
function setGs(g, k, v) { (S.ed.gsets[g] ||= {group:g})[k] = v.trim(); edPreview() }
function edPayload() {
  const E = S.ed
  const G = new Set(Object.values(E.samples))
  const gsets = Object.values(E.gsets).filter(s => G.has(s.group) && (s.order !== undefined && s.order !== '' || s.x || s.series || s.color))
  return {exp:E.exp, wells:E.wells, samples:E.samples, gsets}
}
let edTimer = null
function edPreview() {
  clearTimeout(edTimer)
  edTimer = setTimeout(guard(async () => {
    const a = await api('/api/analyze', edPayload())
    const box = $('#edprev'); if (!box) return
    const s = a.qc_summary
    box.innerHTML = warnBox(a.warnings) + (a.targets.length ? `<div class="card"><div class="card-h"><h3>结果预览</h3><span class="muted" style="font-size:12px">复孔 QC：合格 ${s.pass}，剔除修正 ${s.fixed}，超阈 ${s.fail}</span></div><div class="card-b" style="display:flex;gap:28px;flex-wrap:wrap">
      ${a.targets.map(t => `<div><div class="gene-h" style="font-weight:600;margin-bottom:4px">${esc(t)}</div>${a.groups_order.filter(g => a.genes[t].groups[g]).map(g => `<div class="num" style="font-size:12.5px">${esc(g)}：${fmt(a.genes[t].groups[g].mean, 3)} <span class="sig">${g===a.ctrl?'':esc(a.genes[t].stats.stars_vs_control[g]||'')}</span></div>`).join('')}</div>`).join('')}
    </div></div>` : '')
  }), 250)
}
const saveEdit = guard(async () => {
  const E = S.ed
  if (!E.exp.name.trim()) return toast('请填写实验名称', true)
  const btn = $('#savebtn'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 保存中'
  try {
    const r = await api('/api/experiment/save', {project:S.proj, ...edPayload(), files:E.files})
    await loadProjects()
    toast('已保存并写入项目 Excel')
    await openExp(S.proj, r.id, 'res')
  } finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = '保存到项目 Excel' } }
})

// ------------------------------------------------------------ 弹窗
function dialog(title, body, okText, onOk, danger) {
  const m = document.createElement('div'); m.className = 'mask'
  m.innerHTML = `<div class="dlg"><div class="card-h"><h3>${title}</h3></div><div class="card-b">${body}</div><div class="foot"><button class="btn" data-x>取消</button><button class="btn primary" data-ok style="${danger?'background:var(--bad);border-color:var(--bad)':''}">${okText}</button></div></div>`
  document.body.appendChild(m)
  const close = () => m.remove()
  m.querySelector('[data-x]').onclick = close
  m.onclick = ev => { if (ev.target === m) close() }
  m.querySelector('[data-ok]').onclick = guard(async () => { if (await onOk(m) !== false) close() })
  const inp = m.querySelector('input'); if (inp) { inp.focus(); inp.onkeydown = ev => { if (ev.key === 'Enter') m.querySelector('[data-ok]').click() } }
}
function dlgNewProject() {
  dialog('新建项目', `<label class="f">项目名称<input id="pn" placeholder="例如：炎症通路 qPCR"></label><label class="f">描述（可选）<input id="pd" placeholder="课题、负责人等"></label><div class="muted" style="font-size:12px">会在数据库里建同名文件夹与 Excel 总表。</div>`, '创建', async m => {
    const name = m.querySelector('#pn').value.trim()
    if (!name) { toast('请填写项目名称', true); return false }
    const r = await api('/api/project/create', {name, desc:m.querySelector('#pd').value.trim()})
    await loadProjects(); S.proj = r.name; S.openProj.add(r.name); S.catFilter = ''; go('project')
  })
}
function dlgDelete() {
  const e = S.exp.exp
  dialog('删除实验', `确定删除 <b>${esc(e.id)} ${esc(e.name)}</b> 吗？<div class="muted" style="font-size:12.5px">会从项目 Excel 中移除它的所有数据。删除前的版本保留在项目的「.备份」文件夹，原始 CFX 文件不会删除。</div>`, '删除', async () => {
    await api('/api/experiment/delete', {project:S.proj, id:e.id})
    await loadProjects(); toast('已删除'); go('project')
  }, true)
}
function dlgSettings() {
  dialog('设置', `<label class="f">数据库位置<input id="root" value="${esc(S.meta.root)}"><span class="hint">所有项目文件夹存放处。留空恢复默认（我的文档/qPCR数据库）。</span></label>
    <div style="display:flex;gap:8px"><button class="btn sm" onclick="guard(()=>api('/api/open_folder',{}))()">打开数据库文件夹</button><button class="btn sm danger" onclick="quitApp()">退出程序</button></div>`, '保存', async m => {
    const r = await api('/api/config', {root:m.querySelector('#root').value.trim()})
    S.meta.root = r.root; await loadProjects(); go('home'); toast('数据库位置：' + r.root)
  })
}
function quitApp() { api('/api/shutdown', {}).finally(() => { document.body.innerHTML = '<div class="empty" style="padding-top:20vh"><h3>qPCR 数据中心已退出</h3><p>可以关闭这个页面了。</p></div>' }) }

// ------------------------------------------------------------ 启动
// 每个标签页一个编号，全部关闭后本地服务自动退出
const TAB = Math.random().toString(36).slice(2)
function ping() { fetch('/api/ping?tab=' + TAB).catch(() => {}) }
addEventListener('pagehide', () => navigator.sendBeacon('/api/bye?tab=' + TAB))
addEventListener('pageshow', e => { if (e.persisted) ping() })
;(async () => {
  try {
    S.meta = await api('/api/meta')
    await loadProjects()
    go('home')
  } catch (e) { $('#main').innerHTML = `<div class="page"><div class="notes">无法连接本地服务：${esc(e.message)}</div></div>` }
  ping()
  setInterval(ping, 5000)
})()
</script>
</body>
